<html> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device:width,initial-scale=1.0"> 
        <title>Document</title>
    </head> 
    <body> 
        <div id ="all"> 
            <p>One</p> 
            <span>Two</span> 
            <div>Three</div>
        </div>

    <script> 
        const newElement =document.createElement("div");  
        const writeIntoNewEle =document.createTextNode("Newly created element"); 
        const all = document.getElement.getElementbyId("all"); 
        all.append(newElement.textcontent=writeIntoNewEle);
    </script>
</html>

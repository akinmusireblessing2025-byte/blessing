<html> 
    <head>  
        <link rel="stylesheet" href="weekend.css">
    </head> 
    <body>  
        <fieldset>
        <legend>Student Grade Calculator</legend> 
         
        <div class="emmy1"> 
     <label>Student Name</label> 
     <input type="Text"id="studentName"placeholder="Enter student name">
        </div> 

    <div class="emmy2"> 
        <label>Mathematical Score</label>  
        <input type="number"id="math" placeholder="70-100">  
    </div> 
    <div class="emmy3">  
    <label>English Score</label> 
    <input type="number"id="english" placeholder="60-69">
    </div> 
    <div class="emmy4"> 
    <label>Biology Score</label>  
    <input type="number"id="biology" placeholder="50-59"> 
    </div> 
    <div class="emmy5"> 
    <label>Physics Score</label>   
    <input type="number"id="physics" placeholder="45-49">      
    </div> 
    <div class="emmy6"> 
    <label>Chemistry Score</label> 
    <input type="number"id="chemistry" placeholder="40-44">
    </div>  
    <br><br>
    <button onclick="calculateTotal()">Calculate Result</button>   
        </fieldset>  
         
         
    <div id="result"></div>

</html>
